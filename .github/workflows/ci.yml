name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: companyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/companyos_test?schema=public"

      - name: Run database migrations for testing
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/companyos_test?schema=public"

      - name: Lint Frontend
        run: npm run lint

      - name: Build All Workspaces
        run: npm run build

      - name: Run Test Suite
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/companyos_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret-key-123456789"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-key-123456789"
          NODE_ENV: "test"
